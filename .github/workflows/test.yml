name: Tests
on:
  push:
    branches: [main]   # post-merge run on main; PRs are covered by pull_request
  pull_request:

permissions:
  contents: read

jobs:
  next-version:
    name: next-version.sh unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run next-version unit tests
        run: bash scripts/next-version.test.sh

  lint:
    name: actionlint + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck scripts
        run: shellcheck scripts/*.sh   # preinstalled on ubuntu-latest
      # The official image bundles shellcheck, so `run:` blocks get linted too.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
